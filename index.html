<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Explorá el menú, elegí tus favoritos y hacé tu pedido por WhatsApp.">
  <meta name="theme-color" content="#f4b501">
  <title>Menú digital · LKB Smash</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="LKB Smash · Menú digital">
  <meta property="og:description" content="Explorá el menú de LKB Smash y hacé tu pedido por WhatsApp.">
  <meta property="og:url" content="https://jrcwebdesign.github.io/menu-digital-mvp/">
  <meta property="og:image" content="https://jrcwebdesign.github.io/menu-digital-mvp/assets/img/logo.jpg">
  <meta property="og:image:alt" content="Logo de LKB Smash">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://jrcwebdesign.github.io/menu-digital-mvp/assets/img/logo.jpg">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <div id="app">
    <header id="restaurant-header" aria-label="Información del local"></header>

    <main class="page-shell">
      <section id="restaurant-status" aria-live="polite"></section>
      <section id="featured-product" aria-label="Producto destacado"></section>
      <section id="categories"></section>
      <section id="menu" aria-label="Menú del local"></section>
      <section id="google-reviews" aria-label="Dejá una reseña en Google"></section>
      <section id="social-links" aria-label="Redes sociales y contacto"></section>
    </main>

    <div id="cart-bar" class="cart-bar hidden"></div>
    <div id="cart-drawer" class="drawer hidden" aria-hidden="true"></div>
    <div id="product-modal" class="modal hidden" aria-hidden="true"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
